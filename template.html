		only preload the format most likely to be used, do not preload multiple formats
		if images are loaded responsively, use the media attribute to preload the correct image based on media queries

		<link rel="preconnect">
			- for the most critical connections on the current page, that are likely to be used within under 10s of page load
		<link rel="dns-prefetch">
			- for connections that are not likely to be opened within 10s of page load

		use preconnect or dns-prefetch if preload is not possible for the resource (such as websockets or APIs)

		<link rel="prefetch href="">
