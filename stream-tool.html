<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,user-scalable=no"
		/>
		<style>
			.overlay-btn {
				position: absolute;
				top: 1em;
				z-index: 10;
				padding: 0.4em 0.7em;
				border: none;
				border-radius: 6px;
				font-size: 1.1em;
				cursor: pointer;
				background: #333;
				color: #fff;
			}

			@media (max-aspect-ratio: 1/1) {
				.camera {
					top: 0;
					left: 0;
					width: 100vw;
					height: 50vh;
				}

				.chat {
					top: 50vh;
					left: 0;
					width: 100vw;
					height: 50vh;
				}
			}

			@media (min-aspect-ratio: 1/1) or (aspect-ratio: 1/1) {
				.camera {
					top: 0;
					left: 0;
					width: 50vw;
					height: 100vh;
				}

				.chat {
					top: 0;
					left: 50vw;
					width: 50vw;
					height: 100vh;
				}
			}

			iframe {
				border: none;
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
			}

			#alerts {
				pointer-events: none;
				opacity: 0.85;
			}

			#togglefull { left: 1em; }

			#tracker { right: 1em; }
			#tracker.active { background: #0a0; }
			#tracker.pending { background: #a80; }
		</style>
	</head>
	<body>
		<iframe
			class="camera"
			id="camera"
			allow="autoplay *;camera *;microphone *;picture-in-picture *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<iframe
			class="chat"
			id="chat"
			allow="autoplay *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<iframe
			class="chat"
			id="alerts"
			allow="autoplay *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<button id="togglefull" class="overlay-btn">🟢</button>
		<button id="tracker" class="overlay-btn" style="display:none">⏹</button>
		<script>
			document.getElementById("togglefull").onclick = () => {
				document.body.requestFullscreen();
			};
			document.body.onfullscreenchange = () => {
				if (document.fullscreenElement) {
					document.getElementById("togglefull").style.display =
						"none";
				} else {
					document.getElementById("togglefull").style.display =
						"unset";
				}
			};

			const params = new URL(window.location.href).searchParams;

			let streamingURL = (document.getElementById("camera").src =
				"https://psychosis.live/?role=sender&stats=true&id=" +
				params.get("id") +
				"&channelCount=1&facingMode=environment&autoGainControl=true&echoCancellation=remote-only&audioContentHint=music&videoContentHint=motion" +
				"&dynamicAudioBitrate=true&dynamicVideoFramerate=true&codecPreferences=%5B%22video%2FAV1%22%2C%22video%2FVP9%22%2C%22video%2FH265%22%2C%22video%2FH264%22%2C%22video%2FVP8%22%2C%22audio%2Fopus%22%2C%22audio%2Fred%22%2C%22audio%2Fmp4a-latm%22%2C%22audio%2FG722%22%2C%22audio%2FPCMU%22%2C%22audio%2FPCMA%22%5D");
			switch (params.get("preset")) {
				case "1440p60":
					streamingURL =
						streamingURL +
						"&width=2560&height=1440&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "1440p30":
					streamingURL =
						streamingURL +
						"&width=2560&height=1440&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
				case "1080p60":
					streamingURL =
						streamingURL +
						"&width=1920&height=1080&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "1080p30":
					streamingURL =
						streamingURL +
						"&width=1920&height=1080&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "720p60":
					streamingURL =
						streamingURL +
						"&width=1280&height=720&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "720p30":
					streamingURL =
						streamingURL +
						"&width=1280&height=720&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
				case "540p30":
				default:
					streamingURL =
						streamingURL +
						"&width=960&height=540&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
			}
			if (params.has("iceServers")) {
				streamingURL =
					streamingURL + "&iceServers=" + params.get("iceServers");
			}
			streamingURL = streamingURL + "#" + params.get("pass");
			document.getElementById("camera").src = streamingURL;

			// &sdk not used in the OBS overlay

			document.getElementById("chat").src =
				"https://socialstream.ninja/dock.html?session=" +
				params.get("session") +
				"&compact&alignbottom&notime&hidemenu&server&noavatar&autoscroll&sdk"; // not here, but used in OBS overlay: &delaytime=600
			document.getElementById("alerts").src =
				"https://socialstream.ninja/multi-alerts.html?session=" +
				params.get("session") +
				"&compact&queue&align=center&server&beep&sdk"; // &beep not used in OBS overlay

			// --- Location tracker sender ---
			(function() {
				const trackerUrl = params.get("tracker");
				const token = params.get("token");
				if (!trackerUrl || !token) return;

				const btn = document.getElementById("tracker");
				btn.style.display = "unset";

				const endpoint = trackerUrl.replace(/\/$/, "") + "/api/location";
				const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };

				const queue = [];
				let watchId = null;
				let sending = false;
				let draining = false; // true = stop queued, don't add more locations

				async function send(body) {
					const r = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(body) });
					if (!r.ok) throw new Error(r.status);
				}

				async function flush() {
					if (sending) return;
					sending = true;
					while (queue.length) {
						const item = queue[0];
						const deadline = Date.now() + 120_000;
						let delay = 1000;
						while (Date.now() < deadline) {
							try { await send(item); break; }
							catch { await new Promise(r => setTimeout(r, delay)); delay = Math.min(delay * 2, 15_000); }
						}
						queue.shift();
					}
						sending = false;
						if (draining) { draining = false; btn.textContent = "⏹"; btn.classList.remove("active", "pending"); }
				}

				function startTracking() {
					draining = false;
					watchId = navigator.geolocation.watchPosition(pos => {
						if (draining) return;
						queue.push({ type: "location", lat: pos.coords.latitude, lon: pos.coords.longitude, timestamp_ms: Date.now() });
						flush();
					});
				}

				function stopTracking() {
					if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
					draining = true;
					queue.push({ type: "stop" });
					flush();
				}

				btn.onclick = () => {
					if (draining) return; // already stopping
					if (watchId !== null) { stopTracking(); btn.textContent = "⏳"; btn.classList.add("pending"); btn.classList.remove("active"); }
					else { startTracking(); btn.textContent = "📡"; btn.classList.add("active"); btn.classList.remove("pending"); }
				};

				// On load: check if server has an active session and resume
				fetch(endpoint + "/status", { headers })
					.then(r => r.json())
					.then(data => { if (data.live) { startTracking(); btn.textContent = "📡"; btn.classList.add("active"); } })
					.catch(() => {});
			})();
		</script>
	</body>
</html>
