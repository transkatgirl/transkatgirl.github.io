<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,user-scalable=no"
		/>
		<!--
			Note: A precompiled binary of the patched Android Chromium build necessary to fix some of the most major input device bugs can be found at https://drive.google.com/file/d/1qB7MVyEPb76aJGJpYDjosrmIQjdXv0gt/view.
			(Source code is available in /assets/patches/ directory of this repository).

			Keep in mind that this build has plenty of bugs of its own (i'm not exactly the most experienced with Android or Chromium development lol), and is not recommended as a daily-driver browser. Only use it if you NEED it (such as if you plan on using an external microphone), and watch out for any regressions that it might cause.

			Regardless of what device and software you plan on using for streaming, you should always heavily test your whole software stack before using it live.
		-->
		<style>
			button {
				position: relative;
				top: 1em;
				left: 0;
				margin-left: 1em;
				font-size: 110%;
				user-select: none;
				-webkit-user-select: none;
				-moz-user-select: none;
			}

			input[type="checkbox"] {
				position: relative;
				top: 1em;
				left: 0;
				margin-left: 1em;
				transform: translateX(50%) scale(2);
				transform-origin: center left;
			}

			@media (max-aspect-ratio: 1/1) {
				.camera {
					top: 0;
					left: 0;
					width: 100vw;
					height: 50vh;
				}

				.chat {
					top: 50vh;
					left: 0;
					width: 100vw;
					height: 50vh;
				}

				.swap .camera {
					top: 50vh;
					left: 0;
					width: 100vw;
					height: 50vh;
				}

				.swap .chat {
					top: 0;
					left: 0;
					width: 100vw;
					height: 50vh;
				}
			}

			@media (min-aspect-ratio: 1/1) or (aspect-ratio: 1/1) {
				.camera {
					top: 0;
					left: 0;
					width: 50vw;
					height: 100vh;
				}

				.chat {
					top: 0;
					left: 50vw;
					width: 50vw;
					height: 100vh;
				}

				.swap .camera {
					top: 0;
					left: 50vw;
					width: 50vw;
					height: 100vh;
				}

				.swap .chat {
					top: 0;
					left: 0;
					width: 50vw;
					height: 100vh;
				}
			}

			iframe {
				border: none;
				position: absolute;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
			}

			#alerts {
				pointer-events: none;
				opacity: 0.85;
			}
		</style>
	</head>
	<body>
		<iframe
			class="camera"
			id="camera"
			allow="autoplay *;camera *;microphone *;picture-in-picture *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<iframe
			class="chat"
			id="chat"
			allow="autoplay *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<iframe
			class="chat"
			id="alerts"
			allow="autoplay *;screen-wake-lock *;speaker-selection *"
		></iframe>
		<button id="togglefull">🟢</button>
		<button id="toggleswap">🔀</button>
		<button id="reloadcamera">📹 🔄</button>
		<button id="reloadchat">💬 🔄</button>
		<input type="checkbox" id="togglelocation" name="location" switch />
		<script>
			document.body.onfullscreenchange = () => {
				if (document.fullscreenElement) {
					for (const button of document.getElementsByTagName(
						"button"
					)) {
						button.style.display = "none";
					}
					for (const input of document.getElementsByTagName(
						"input"
					)) {
						input.style.display = "none";
					}
				} else {
					for (const button of document.getElementsByTagName(
						"button"
					)) {
						button.style.display = "unset";
					}
					for (const input of document.getElementsByTagName(
						"input"
					)) {
						input.style.display = "unset";
					}
				}
			};
			document.getElementById("togglefull").onclick = () => {
				document.body.requestFullscreen();
			};
			document.getElementById("toggleswap").onclick = () => {
				if (document.body.classList.contains("swap")) {
					document.body.classList.remove("swap");
				} else {
					document.body.classList.add("swap");
				}
			};

			const params = new URL(window.location.href).searchParams;

			/*

			On psychosis.live receiver side, the following non-default parameters are used:
			- &overrideScaler=true (can be problematic but often delivers a noticeable quality improvement - test this beforehand)
			- &dynamicVideoParams=[JSON encoded list of MIME type strings]
				- audio codec preferences are left as default, sometimes video/VP9 is preferred over video/AV1 due to the VP9 encoder often being more resource efficient on ARM and/or supporting hardware encoding. however, VP9 performs far worse at very low bitrates when compared to AV1

			For remote controlling OBS, I personally use Tailscale + NoMachine (more bandwidth efficient but proprietary VNC alternative), as it gives me far more flexibility and troubleshooting ability than the Websocket interface.

			Tailscale can also act as a quick-and-dirty but bandwidth-inefficient alternative (overhead of ~5.3%) to a TURN server, which is definitely useful in a pinch but not what I'd recommend for long term use.

			*/

			let streamingURL = (document.getElementById("camera").src =
				"https://psychosis.live/?role=sender&stats=true&id=" +
				params.get("id") +
				"&channelCount=1&facingMode=environment&audioContentHint=music&videoContentHint=motion" +
				"&dynamicAudioBitrate=true&dynamicVideoParams=true&codecPreferences=%5B%22video%2FAV1%22%2C%22video%2FVP9%22%2C%22video%2FH265%22%2C%22video%2FH264%22%2C%22video%2FVP8%22%2C%22audio%2Fopus%22%2C%22audio%2Fred%22%2C%22audio%2Fmp4a-latm%22%2C%22audio%2FG722%22%2C%22audio%2FPCMU%22%2C%22audio%2FPCMA%22%5D");
			switch (params.get("preset")) {
				case "1440p60":
					streamingURL =
						streamingURL +
						"&width=2560&height=1440&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "1440p30":
					streamingURL =
						streamingURL +
						"&width=2560&height=1440&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "1080p60":
					streamingURL =
						streamingURL +
						"&width=1920&height=1080&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "1080p30":
					streamingURL =
						streamingURL +
						"&width=1920&height=1080&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "900p60":
					streamingURL =
						streamingURL +
						"&width=1600&height=900&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "900p30":
					streamingURL =
						streamingURL +
						"&width=1600&height=900&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "720p60":
					streamingURL =
						streamingURL +
						"&width=1280&height=720&frameRate=60&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "720p30":
					streamingURL =
						streamingURL +
						"&width=1280&height=720&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "540p30":
					streamingURL =
						streamingURL +
						"&width=960&height=540&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
				case "480p30":
				default:
					streamingURL =
						streamingURL +
						"&width=853&height=480&frameRate=30&maxAudioBitrate=-1&maxVideoBitrate=-1";
					break;
			}
			if (params.has("overrideScaler")) {
				/*

				Usually improves improve visual quality but can cause problems; ALWAYS TEST BEFOREHAND
				Requires Chromium browser to work, along with a fairly powerful device.

				*/
				streamingURL =
					streamingURL +
					"&overrideScaler=" +
					params.get("overrideScaler");
			}
			if (params.has("scalingFilter")) {
				/*

				Changing the scaling filter can help make overrideScaler less resource intensive.

				Default scaler is highest quality, "canvas" scaler is less resource intensive but considerably lower quality (it's just the browser scaler). "media_constraints" is a weird hack that is the least resource intensive but is either the same or slightly lower quality than "canvas".

				*/
				streamingURL =
					streamingURL +
					"&scalingFilter=" +
					params.get("scalingFilter");
			}
			if (params.has("iceServers")) {
				streamingURL =
					streamingURL + "&iceServers=" + params.get("iceServers");
			}
			streamingURL = streamingURL + "#" + params.get("pass");
			document.getElementById("camera").src = streamingURL;

			/*

			Make sure to enable the following options in Social Stream Ninja:
			- Enable remote API control of extension
			- Enable Dock to use and publish via API server
			- Send chat messages to API server (for external listeners)
			- Dock sends its commands to Extension via server

			(Based on https://github.com/steveseguin/social_stream/issues/814#issuecomment-4322138949)

			*/

			document.getElementById("chat").src =
				"https://socialstream.ninja/dock.html?session=" +
				params.get("session") +
				"&compact&alignbottom&notime&hidemenu&server&server2&server3&noavatar&autoscroll&loadlast"; // not used here, but used in OBS overlay: &delaytime=400
			document.getElementById("alerts").src =
				"https://socialstream.ninja/multi-alerts.html?session=" +
				params.get("session") +
				"&compact&queue&align=center&server&server2&server3";

			document.getElementById("reloadcamera").onclick = () => {
				const frame = document.getElementById("camera");
				frame.parentNode.replaceChild(frame.cloneNode(), frame);
			};
			document.getElementById("reloadchat").onclick = () => {
				const chatFrame = document.getElementById("chat");
				chatFrame.parentNode.replaceChild(
					chatFrame.cloneNode(),
					chatFrame
				);
				const alertFrame = document.getElementById("alerts");
				alertFrame.parentNode.replaceChild(
					alertFrame.cloneNode(),
					alertFrame
				);
			};

			/*

			RealtimeIRL (closed source backend) - plug-and-play IRL streaming location sharing: https://rtirl.com
			KatMap (open source) - custom bespoke thing made by my best friend for Twitch Plays Kat: https://github.com/sliced-paraiba/katmap/tree/main

			*/

			let sendLocation = false;

			function handlePosition(position) {
				if (params.has("rtirlPushKey")) {
					fetch(
						"https://rtirl.com/api/push?key=" +
							params.get("rtirlPushKey"),
						{
							method: "POST",
							headers: {
								"Content-Type": "application/json",
							},
							body: JSON.stringify({
								latitude: position.coords.latitude,
								longitude: position.coords.longitude,
								heading: position.coords.heading,
								speed: position.coords.speed,
								altitude: position.coords.altitude,
								timestamp: position.timestamp,
							}),
						}
					).then((response) => {
						console.log(response);
					});
				}
				if (params.has("katMapEndpoint") && params.has("katMapKey")) {
					fetch(params.get("katMapEndpoint") + "/api/location", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							Authorization: "Bearer " + params.get("katMapKey"),
						},
						body: JSON.stringify({
							type: "location",
							lat: position.coords.latitude,
							lon: position.coords.longitude,
							timestamp_ms: position.timestamp,
							accuracy: position.coords.accuracy,
							altitude: position.coords.altitude,
							altitude_accuracy:
								position.coords.altitude_accuracy,
							heading: position.coords.heading,
							speed: position.coords.speed,
						}),
					}).then((response) => {
						console.log(response);
					});
				}
			}

			document.getElementById("togglelocation").onchange = (event) => {
				sendLocation = event.target.checked;

				if (sendLocation) {
					navigator.geolocation.getCurrentPosition(
						(position) => {
							if (!sendLocation) return;

							handlePosition(position);
						},
						(error) => {
							window.alert(error.message);
						},
						{
							maximumAge: 0,
							enableHighAccuracy: true,
						}
					);
				} else {
					if (params.has("rtirlPushKey")) {
						fetch(
							"https://rtirl.com/api/stop?key=" +
								params.get("rtirlPushKey"),
							{
								method: "POST",
							}
						).then((response) => {
							console.log(response);
						});
					}
					if (
						params.has("katMapEndpoint") &&
						params.has("katMapKey")
					) {
						fetch(params.get("katMapEndpoint") + "/api/location", {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								Authorization:
									"Bearer " + params.get("katMapKey"),
							},
							body: JSON.stringify({
								type: "stop",
							}),
						}).then((response) => {
							console.log(response);
						});
					}
				}
			};
			navigator.geolocation.watchPosition(
				(position) => {
					if (!sendLocation) return;

					handlePosition(position);
				},
				(error) => {
					window.alert(error.message);
				},
				{
					maximumAge: 0,
					enableHighAccuracy: true,
				}
			);
		</script>
	</body>
</html>
